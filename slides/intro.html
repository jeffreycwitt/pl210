e passionate about?\"))),mdx(Slide,{mdxType:\"Slide\"},mdx(\"h1\",null,\"Syllabus Highlights\")),mdx(Slide,{mdxType:\"Slide\"},mdx(\"p\",null,'Class involvement is a small part of your grade that typically makes a big difference. Class involvement means, first of all, coming to class. This also means always having your course reading with you in physical form. (Not having your course materials is like coming to soccer practice without your cleats or a ball.) Missing three or more classes will result in an automatic zero for your in-class participation grade. Missing more than 6 classes will be grounds for failing the course. Secondly, it means coming to class prepared, and preparation needs to bear fruit in the classroom. In other words, you need to strive to be an asset to the class. At times we will have opportunities for discussion; someone who is involved in class will be a thoughtful and engaged participant in that discussion. At other times, lectures will solicit your input and/or questions; an engaged student will bring up helpful and appropriate questions and be able to make a positive contribution when class input is called upon. (Using cell phones or laptops in class, unless as an approved DSS accommodation or otherwise directed by the instructor, will result in an automatic 0 for this portion of your grade. See \"Computers and Cell Phones\" policy below. Do yourself a favor and put your laptops and cell phones away and out sight for the duration of our class.)'),mdx(\"p\",null,\"I will give two marks for participation, one at the midterm and the final. 80-85 indicates approaching expectations. It indicates that you are regularly attending, but not necessarily a regular contributor to the class discussion. 85-90 indicates meeting expectations. It indicates that you are not only regularly attending, but that you always have your assigned reading with you, and you are regularly contributing to the class discussion. 90+ indicates exceeding expectations. Above 90 is reserved for participation that is regularly elevating the classroom discussion. This does not mean that you are always talking or dominating the discussion. But it means that, in addition to meeting expectations, your regular contribution to the class discussion habitually shows evidence of purposeful preparation of the assigned course material and reflection on previous course lectures/discussions.\")),mdx(Slide,{mdxType:\"Slide\"},mdx(\"h2\",null,\"Philosophy Reading Tips\"),mdx(\"ul\",null,mdx(\"li\",{parentName:\"ul\"},\"Get into a focused space.\"),mdx(\"li\",{parentName:\"ul\"},\"Reserve space for reading notes; a reading journal of sorts.\"),mdx(\"li\",{parentName:\"ul\"},\"Review the reading questions.\"),mdx(\"li\",{parentName:\"ul\"},\"Sit up when you read.\"),mdx(\"li\",{parentName:\"ul\"},\"Always read with a pencil.\"),mdx(\"li\",{parentName:\"ul\"},\"Annotate the text.\"),mdx(\"li\",{parentName:\"ul\"},\"Write summary or connecting comments in your reading journal (and/or jot dot quick responses to reading questions) with page numbers.\"),mdx(\"li\",{parentName:\"ul\"},\"Don't read all at once. Take breaks. After about 45 minutes you should take a break. \",mdx(\"ul\",{parentName:\"li\"},mdx(\"li\",{parentName:\"ul\"},\"But before you take a break write a once sentence summary of what you think the text has does far and what you expect to come next.\"))),mdx(\"li\",{parentName:\"ul\"},\"When starting a new session, look over your marginal notes and your reading journal, then repeat the above. \"))),mdx(Slide,{mdxType:\"Slide\"},\"**Papers (30%, 15% each)**\",mdx(\"p\",null,\"We will have two in-class papers during the course of semester. Instructions and prompts will be distributed in advance of the upcoming paper.\")),mdx(Slide,{mdxType:\"Slide\"},mdx(\"p\",null,mdx(\"strong\",{parentName:\"p\"},\"Case Study Presentations (10%)\")),mdx(\"p\",null,\"At the end of the semester, we will work on some applied areas of political philosophy. In small groups, students will prepare an in-class presentation and a written report. Instructions will be distributed in advance of the assignment.\")),mdx(Slide,{mdxType:\"Slide\"},mdx(\"p\",null,mdx(\"strong\",{parentName:\"p\"},\"Exams (55%)\")),mdx(\"p\",null,\"We will have two exams during the semester, a mid-term exam (25%) and a final exam (30%). Exams will include a mix of multiple-choice questions, quotation identification, short answer questions, and short essay prompts. Exam review sheets will be distributed in advance of each exam.\")),mdx(Slide,{mdxType:\"Slide\"},mdx(\"p\",null,\"Statement on Generative-AI: \",mdx(\"strong\",{parentName:\"p\"},\"This course focuses on skill building in the areas of close reading, argument analysis, and argument construction.\"),\" As such (and as stated in the above honor code) it is expected that in this course your compositions are self-generated. \",mdx(\"strong\",{parentName:\"p\"},\"While there are many legitimate reasons to use and value generative-AI tools, the goal of this class is to cultivate the very analytical skills that are needed to use AI tools well.\"),\" Therefore outsourcing our class exercises, just as outsourcing drills in athletics, defeats the purpose. Thus, in this class, the above Honor Code includes the expectation that your submitted responses and compositions are always self-generated.\")),mdx(Slide,{mdxType:\"Slide\"},mdx(\"p\",null,\"Selection from John Donne Poem, An Anatomy of the World (1611)\"),mdx(\"p\",null,`205 And new philosophy calls all in doubt,\n206 The element of fire is quite put out,\n207 The sun is lost, and th'earth, and no man's wit\n208 Can well direct him where to look for it.\n209 And freely men confess that this world's spent,\n210 When in the planets and the firmament\n211 They seek so many new; they see that this\n212 Is crumbled out again to his atomies.\n213 'Tis all in pieces, all coherence gone,\n214 All just supply, and all relation;`))))}MDXContent.isMDXComponent=!0;
