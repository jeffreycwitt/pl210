on, p. 3\")),mdx(Slide,{mdxType:\"Slide\"},mdx(\"blockquote\",null,mdx(\"p\",{parentName:\"blockquote\"},'\"In Leviathan, Hobbes will conceive of the difficulty of obeying both the law of men and the revealed law of God as a particular case of the problem of the coherence of two systems of authority, the religious and the political.\"')),mdx(\"p\",null,\"Dumouchel, p. 3\")),mdx(Slide,{mdxType:\"Slide\"},mdx(\"blockquote\",null,mdx(\"p\",{parentName:\"blockquote\"},`\"The first seeds of religion, according to Hobbes, have been made more rich and more complex, developed into positive religions, by two means: the revealed word of God and the various inventions of men. In both cases nonetheless it was done towards the same end: 'to make those men that relyed on them `,\"[religious leaders and beliefs]\",`, the more apt to Obedience, Lawes Peace, Charity and civill Society' (173).\"`)),mdx(\"p\",null,\"Dumouchel, p. 5\")),mdx(Slide,{mdxType:\"Slide\"},mdx(\"blockquote\",null,mdx(\"p\",{parentName:\"blockquote\"},'\"But this situation where they both endeavor a similar result can also be taken to mean that they are rivals, enemies, obstacles to each other on their way to the same end. The political problem of religion comes from the proximity of religion and politics. Religion and politics are competing forms of social organization which vie for the same prize, power.\"')),mdx(\"p\",null,\"Dumouchel, p. 6\")),mdx(Slide,{mdxType:\"Slide\"},mdx(\"blockquote\",null,mdx(\"p\",{parentName:\"blockquote\"},'\"The political problem of religion comes from the fact that to seek religious legitimization for political sovereignty, which appears at first sight as a good thing, is ultimately to subject the eternal foundations of Leviathan to the changing preferences of the subjects.\"')),mdx(\"p\",null,\"Dumouchel, p. 9\")),mdx(Slide,{mdxType:\"Slide\"},mdx(\"blockquote\",null,mdx(\"p\",{parentName:\"blockquote\"},'\"The two institutions are truly radically different and, because of that, the confusion of one with the other which reigns just about everywhere is harmful to both\"')),mdx(\"p\",null,\"Dumouchel, p. 6\")),mdx(Slide,{mdxType:\"Slide\"},mdx(\"blockquote\",null,mdx(\"p\",{parentName:\"blockquote\"},'\"Christianity, as interpreted by Hobbes, can be seen as a solution to the political problem of religion, understood both as the problem of the religious legitimization of politics and as the problem of the political enforcement of religion.\"')),mdx(\"p\",null,\"Dumouchel, p. 12\")),mdx(Slide,{mdxType:\"Slide\"},mdx(\"blockquote\",null,mdx(\"p\",{parentName:\"blockquote\"},'\"It demands that we submit today to a kingdom which will come tomorrow and which for this reason can never be a rival to earthly powers. In return it promises eternal life, absence of all evil. But because it is the present promise of future submission to a King absent, Christianity gives us no new law\"')),mdx(\"p\",null,\"Dumouchel, p. 13\")),mdx(Slide,{mdxType:\"Slide\"},mdx(\"blockquote\",null,mdx(\"p\",{parentName:\"blockquote\"},`\"Christianity resolves the political problem of religion because its existence as a religion indicates that we are in a time in which we are condemned to give to ourselves our own laws. Christianity is the religion which teaches that God gives us no laws and imposes on us, as a punishment of our first parent's sin, the judicature of good and evil. As a consequence there is no religious legitimization of political power, only something like a meta-legitimization, an explanation of why it is that we are doomed to live by human laws only.\"`)),mdx(\"p\",null,\"Dumouchel, p. 13\")),mdx(Slide,{mdxType:\"Slide\"},mdx(\"blockquote\",null,mdx(\"p\",{parentName:\"blockquote\"},'\"Christianity also resolves the political problem of religion understood as the problem of religious toleration. Because by its very nature as a promise which only needs to be believed in, it places all religious obligation outside the reach of the sovereign.\"')),mdx(\"p\",null,\"Dumouchel, p. 13\")),mdx(Slide,{mdxType:\"Slide\"},mdx(\"blockquote\",null,mdx(\"p\",{parentName:\"blockquote\"},`\"If it so happens that his subjects are religious fanatics, convinced that political power is only legitimate if it is ordained by God and that the sovereign should be subject to what they believe is God's commands, what is the sovereign to do?\"`)),mdx(\"p\",null,\"Dumouchel, p. 14\")),mdx(Slide,{mdxType:\"Slide\"},mdx(\"blockquote\",null,mdx(\"p\",{parentName:\"blockquote\"},'\"Finally, the English civil war which rages while Hobbes is writing Leviathan is proof enough that the Christian message separating the Church from the State has not been heard\"')),mdx(\"p\",null,\"Dumouchel, p. 14\")),mdx(Slide,{mdxType:\"Slide\"},mdx(\"blockquote\",null,mdx(\"p\",{parentName:\"blockquote\"},'\"Erastianism is the doctrine of the entire subordination of the Church to the State in matters political and religious.\"')),mdx(\"p\",null,\"Dumouchel, p. 15\")),mdx(Slide,{mdxType:\"Slide\"},mdx(\"blockquote\",null,mdx(\"p\",{parentName:\"blockquote\"},`\"In the absence of a thorough separation of the two domains, Hobbes's advice to the sovereign is to control as much as he can the external and institutional dimension of religion in order to reduce to the utmost all independent influence from the church.\"`)),mdx(\"p\",null,\"Dumouchel, p. 15\"))))}MDXContent.isMDXComponent=!0;\n","scope":{"title":"Class 5","order":5}},"frontMatter":{"title":"Class 5","order":5}},"__N_SSG":true},"page":"/slides/[slug]","query":{"slug":"class-5"},"buildId":"0uMxxPaXxNF7M6SO1oiIs","assetPrefix":"/pl210","isFallback":false,"dynamicIds":[3853,9834],"gsp":true,"scriptLoader":[]}</script></body></html>
