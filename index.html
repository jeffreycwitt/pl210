<!DOCTYPE html><html><head><meta charSet="utf-8"/><meta name="viewport" content="width=device-width"/><meta name="next-head-count" content="2"/><noscript data-n-css=""></noscript><script defer="" nomodule="" src="/pl210/_next/static/chunks/polyfills-c67a75d1b6f99dc8.js"></script><script src="/pl210/_next/static/chunks/webpack-b3522468f151a335.js" defer=""></script><script src="/pl210/_next/static/chunks/framework-5f4595e5518b5600.js" defer=""></script><script src="/pl210/_next/static/chunks/main-8cd3bac5877b11a1.js" defer=""></script><script src="/pl210/_next/static/chunks/pages/_app-dc14f8483464b560.js" defer=""></script><script src="/pl210/_next/static/chunks/609-839cde3b38eaf454.js" defer=""></script><script src="/pl210/_next/static/chunks/pages/index-0af102eaa88bb8f0.js" defer=""></script><script src="/pl210/_next/static/qGO0vcN9Xn97bWRQnoXkI/_buildManifest.js" defer=""></script><script src="/pl210/_next/static/qGO0vcN9Xn97bWRQnoXkI/_ssgManifest.js" defer=""></script><style id="__jsx-dd399de06e802c6d">.wrapper.jsx-2a3e6bdc63d0176f{max-width:750px;margin-left:1%;padding:1.5rem}</style><style id="__jsx-e05dd1126074a235">:root{--site-color:royalblue;--divider-color:rgba(0, 0, 0, 0.4)}html{font:100%/1.5 system-ui;margin-left:20px}a{color:inherit;-webkit-text-decoration-color:var(--divider-color);-moz-text-decoration-color:var(--divider-color);text-decoration-color:var(--divider-color);text-decoration-thickness:2px}a:hover{color:var(--site-color);-webkit-text-decoration-color:currentcolor;-moz-text-decoration-color:currentcolor;text-decoration-color:currentcolor}h1,p{margin-bottom:1em}code{font-family:"Menlo"}</style></head><body><div id="__next" data-reactroot=""><div class="jsx-2a3e6bdc63d0176f wrapper"><h1>PL 210 (Politics and Society) Guided Reading Questions</h1><ul><li><h2>Class <!-- -->2</h2><ul><li><span>Reading <!-- -->1<!-- -->: </span><a href="/pl210/posts/hobbes-1">The Leviathan, Introduction and cc. 5-7</a></li></ul></li><li><h2>Class <!-- -->3</h2><ul><li><span>Reading <!-- -->2<!-- -->: </span><a href="/pl210/posts/hobbes-2">The Leviathan, cc. 10-13</a></li></ul></li><li><h2>Class <!-- -->4</h2><ul><li><span>Reading <!-- -->3<!-- -->: </span><a href="/pl210/posts/hobbes-3">The Leviathan, cc. 14-15</a></li></ul></li><li><h2>Class <!-- -->5</h2><ul><li><span>Reading <!-- -->4<!-- -->: </span><a href="/pl210/posts/hobbes-4">The Leviathan, cc. 17-19, 26</a></li></ul></li></ul></div></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"posts":[{"content":"\n\u003cQuestionBlock type=\"reading-content\"\u003e\n\u003cQuestion level={1}\u003eConsider how \"nature\" and \"art\" are described and related in the opening lines.\u003c/Question\u003e\n\u003cQuestion level={2}\u003eWhen he says \"nature\" what does he mean?\u003c/Question\u003e\n\u003cQuestion level={2}\u003eHow is art related to nature? How is it similar to nature or different?\u003c/Question\u003e\n\u003c/QuestionBlock\u003e\n\n\u003cQuestionBlock type=\"reading-content\"\u003e\n\u003cQuestion level={1}\u003eWhy is the Leviathan or the State said to be a product of art? How is it an imitation of nature?\u003c/Question\u003e\n\u003c/QuestionBlock\u003e\n\n\u003cQuestionBlock type=\"reading-content\"\u003e\n\u003cQuestion level={1}\u003eAs the State is described, what kind of picture of the human person emerges?\u003c/Question\u003e\n\u003c/QuestionBlock\u003e\n\n\u003cQuestionBlock type=\"reading-content\"\u003e\n\u003cQuestion level={1}\u003eAt the bottom of 117b Hobbes gives a description of his plan for the rest of his book. What does he plan to do?\u003c/Question\u003e\n\u003c/QuestionBlock\u003e\n\n\u003cQuestionBlock type=\"reading-content\"\u003e\n\u003cQuestion level={1}\u003eRegarding the first part of his investigation, he criticizes where others have begun their investigation and instructs us to start elsewhere. Where does he think we should begin?\u003c/Question\u003e\n\u003cQuestion level={2}\u003eDoes this tell us anything about his procedure?\u003c/Question\u003e\n\u003cQuestion level={2}\u003eIs there something distinctively modern about this starting point?\u003c/Question\u003e\n\u003cQuestion level={2}\u003eCould he be rejecting the methods of the past in some way? If so, how?\u003c/Question\u003e\n\u003c/QuestionBlock\u003e\n\nWhile I'm not asking you to read chapters 1-4, it is a good idea to look at the titles of these chapters and browse around to get a sense of what Hobbes is up to.\n\n\u003cQuestionBlock type=\"reading-content\"\u003e\n\u003cQuestion level={1}\u003eWhat definition does Hobbes give to the word \"reason\" (c. 5, p. 128b)?\u003c/Question\u003e\n\u003c/QuestionBlock\u003e\n\n\u003cQuestionBlock type=\"reading-content\"\u003e\n\u003cQuestion level={1}\u003eWhy does Hobbes think Philosophers have so often been led into error? What is needed to correct this? (c. 5, p. 130)\u003c/Question\u003e\n\u003c/QuestionBlock\u003e\n\n\u003cQuestionBlock type=\"reading-content\"\u003e\n\u003cQuestion level={1}\u003eOn p. 131a, Hobbes gives a nice summary of how the mind thinks, how it ensures clarity, and how it proceeds to the \"benefit of mankind\". What sorts of things are said to prevent us from this clarity and leave humanity without benefit?\u003c/Question\u003e\n\u003c/QuestionBlock\u003e\n\n\u003cQuestionBlock type=\"reading-content\"\u003e\n\u003cQuestion level={1}\u003eIn chapter 6, pay particular attention to what Hobbes defines as \"good\" (p. 132b).\u003c/Question\u003e\n\u003c/QuestionBlock\u003e\n\n\u003cQuestionBlock type=\"reading-content\"\u003e\n\u003cQuestion level={1}\u003eThe idea of \"fear\" becomes important later on in the text, so make sure to identify the definition Hobbes assigns to \"Fear\" (see p. 133).\u003c/Question\u003e\n\u003c/QuestionBlock\u003e\n\n\u003cQuestionBlock type=\"reading-content\"\u003e\n\u003cQuestion level={1}\u003eFrom chapter 7, be able to distinguish the difference between Opinion, Science, and Belief or Faith.\u003c/Question\u003e\n\u003cQuestion level={2}\u003eIn whom do we really trust, when we have faith in religious doctrine?\u003c/Question\u003e\n\u003cQuestion level={2}\u003eWhy does Hobbes show this early concern for religion? Could there be any historical reasons for this concern (Hobbes lived from 1588-1679)?\u003c/Question\u003e\n\u003c/QuestionBlock\u003e\n\n\u003cQuestionBlock type=\"reading-discussion\"\u003e\n\u003cQuestion level={1}\u003eWhat's your reaction to Hobbes's definition of reason? Does it seem different than other conceptions of reason that you've seen in other thinkers? How so?\u003c/Question\u003e\n\u003cQuestion level={2}\u003eDoes Hobbes's understanding of the \"good\" seem correct or problematic to you? Is it different from ideas of the good seen in other philosophers?\u003c/Question\u003e\n\u003c/QuestionBlock\u003e\n","data":{"title":"The Leviathan, Introduction and cc. 5-7","description":"The Leviathan, Introduction and cc. 5-7","order":1,"classno":2,"published":true},"filePath":"hobbes-1.mdx"},{"content":"\n\u003cQuestionBlock type=\"reading-content\"\u003e\n\u003cQuestion level={1}\u003eMake sure you understand Hobbes's conception of the nature of power. What is the greatest form of power?\u003c/Question\u003e\n\u003c/QuestionBlock\u003e\n\n\u003cQuestionBlock type=\"reading-content\"\u003e\n\u003cQuestion level={1}\u003eHow does Hobbes's definition of human worth depend on power?\u003c/Question\u003e\n\u003c/QuestionBlock\u003e\n\n\u003cQuestionBlock type=\"reading-content\"\u003e\n\u003cQuestion level={1}\u003ePlease consider carefully paragraphs 1 and 2 of chapter 11. Consider Hobbes's discussion of our restless desire for power. Why is this desire restless?\u003c/Question\u003e\n\u003c/QuestionBlock\u003e\n\nWhile chapter 12 is long, here are four questions to consider. (Note that while the idea of a religious government is very foreign to us in the present, it was a central issue in the English Civil War. Both sides appealed to God as the ultimate political authority and the justification for their claims to power. In keeping with Hobbes's proclivity to break with the past, his aim here is to show that a religious government will not, in the end, work.)\n\n\u003cQuestionBlock type=\"reading-content\"\u003e\n\u003cQuestion level={2}\u003eWhat are the four reasons Hobbes gives for why religions have been created?\u003c/Question\u003e\n\u003cQuestion level={2}\u003eHow are fear and desire essential to Hobbes's understanding of how religion functions and motivates people?\u003c/Question\u003e\n\u003cQuestion level={2}\u003eHow has religion (and its general origins in ignorance and fear) been used as a means of political control?\u003c/Question\u003e\n\u003cQuestion level={2}\u003eWhat is the eventual problem with government based on religion?\u003c/Question\u003e\n\u003c/QuestionBlock\u003e\n\n\u003cQuestionBlock type=\"reading-content\"\u003e\n\u003cQuestion level={1}\u003eAccording to chapter 13, what is the state of nature, and why is equality an essential component of it?\u003c/Question\u003e\n\u003c/QuestionBlock\u003e\n\n\u003cQuestionBlock type=\"reading-content\"\u003e\n\u003cQuestion level={1}\u003eWhy does this equality lead to conflict and mistrust (diffidence)?\u003c/Question\u003e\n\u003c/QuestionBlock\u003e\n\n\u003cQuestionBlock type=\"reading-content\"\u003e\n\u003cQuestion level={1}\u003eWhat is the best way to defend yourself, if you mistrust everyone else?\u003c/Question\u003e\n\u003c/QuestionBlock\u003e\n\n\u003cQuestionBlock type=\"reading-content\"\u003e\n\u003cQuestion level={1}\u003eWhat are the \"incommodities\" of the \"state of nature\"?\u003c/Question\u003e\n\u003c/QuestionBlock\u003e\n\n\u003cQuestionBlock type=\"reading-content\"\u003e\n\u003cQuestion level={1}\u003eWhat are the passions that drive us toward peace?\u003c/Question\u003e\n\u003c/QuestionBlock\u003e\n\n\u003cQuestionBlock type=\"reading-discussion\"\u003e\n\u003cQuestion level={1}\u003eIn what way do you see \"fear\" and \"power\" working together in Hobbes's conception of human of motivation? Can we ever have enough power according to Hobbes? Why or why not?\u003c/Question\u003e\n\u003c/QuestionBlock\u003e\n","data":{"title":"The Leviathan, cc. 10-13","description":"The Leviathan, cc. 10-13","order":2,"classno":3,"published":true},"filePath":"hobbes-2.mdx"},{"content":"\n\u003cQuestionBlock type=\"reading-content\"\u003e\n\u003cQuestion level={1}\u003eContrast Hobbes' understanding of the Right of Nature and the Law of Nature.\u003c/Question\u003e\n\u003cQuestion level={2}\u003eHow does the Law of Nature seem to follow from the Right of Nature?\u003c/Question\u003e\n\u003cQuestion level={2}\u003eHow is reason involved here? Why doesn't this Law exist for mere animals?\u003c/Question\u003e\n\u003c/QuestionBlock\u003e\n\n\u003cQuestionBlock type=\"reading-content\"\u003e\n\u003cQuestion level={1}\u003eWhat is the first law of nature? Why would not obeying it usually be a violation of the general Law of Nature?\u003c/Question\u003e\n\u003c/QuestionBlock\u003e\n\n\u003cQuestionBlock type=\"reading-content\"\u003e\n\u003cQuestion level={1}\u003eAre there occasions when the first law of nature need not be obeyed? What are these occasions?\u003c/Question\u003e\n\u003cQuestion level={2}\u003eWhat does this say about the idea of \"rights\"?\u003c/Question\u003e\n\u003cQuestion level={2}\u003eDoes our natural right/liberty trump natural laws or do laws trump rights? Is there limit to how far a law can obligate us? What is this limit?\u003c/Question\u003e\n\u003c/QuestionBlock\u003e\n\n\u003cQuestionBlock type=\"reading-content\"\u003e\n\u003cQuestion level={1}\u003eWhat is the second law of nature?\u003c/Question\u003e\n\u003cQuestion level={2}\u003eWhy does this follow from the injunction of the first?\u003c/Question\u003e\n\u003cQuestion level={2}\u003eHow does this law begin to combat the culture of fear described in c. 13?\u003c/Question\u003e\n\u003c/QuestionBlock\u003e\n\n\u003cQuestionBlock type=\"reading-content\"\u003e\n\u003cQuestion level={1}\u003eWhat is Hobbes' definition of a contract or a covenant?\u003c/Question\u003e\n\u003cQuestion level={2}\u003eWhat is its relation to the second law of nature?\u003c/Question\u003e\n\u003cQuestion level={2}\u003eWhat is needed for a covenant to be valid rather than void? Why?\u003c/Question\u003e\n\u003c/QuestionBlock\u003e\n\n\u003cQuestionBlock type=\"reading-content\"\u003e\n\u003cQuestion level={1}\u003eWhat is justice? What is injustice?\u003c/Question\u003e\n\u003cQuestion level={2}\u003eWhy can there be no justice or injustice in the state of nature, and why do these concepts only begin to exist in the Commonwealth? (c. 15)\u003c/Question\u003e\n\u003c/QuestionBlock\u003e\n\n\u003cQuestionBlock type=\"reading-content\"\u003e\n\u003cQuestion level={1}\u003eIn c. 15:\u003c/Question\u003e\n\u003cQuestion level={2}\u003eHow do \"good\" and \"evil\", \"right and wrong\", acquire a universal and absolute (non-relative) status in society that they did not have in the state of nature?\u003c/Question\u003e\n\u003cQuestion level={2}\u003eWhat one universal desire in the state of nature grounds this transition?\u003c/Question\u003e\n\u003c/QuestionBlock\u003e\n\n\u003cQuestionBlock type=\"reading-discussion\"\u003e\n\u003cQuestion level={1}\u003eIn what ways do you see Hobbes, in chapter 14, urging individuals to settle for something less than perfect? Why does Hobbes think the use of our unrestrained natural right will lead to less freedom and not more? Why does giving up some of our natural freedom, in the end, give us more freedom and not less?\u003c/Question\u003e\n\u003c/QuestionBlock\u003e\n","data":{"title":"The Leviathan, cc. 14-15","description":"The Leviathan, cc. 14-15","order":3,"classno":4,"published":true},"filePath":"hobbes-3.mdx"},{"content":"\n## Leviathan, cc. 17-19\n\n\u003cQuestionBlock type=\"reading-content\"\u003e\n\u003cQuestion level={1}\u003eWhat is the end or purpose of the commonwealth (c. 17)?\u003c/Question\u003e\n\u003cQuestion level={2}\u003eHow does this connect to Hobbes' discussion of the need for covenants and the difficulty of making a \"valid\" covenant in c. 14 and 15?\u003c/Question\u003e\n\u003c/QuestionBlock\u003e\n\n\u003cQuestionBlock type=\"reading-content\"\u003e\n\u003cQuestion level={1}\u003eWhy can't human beings be like bees (c. 17)?\u003c/Question\u003e\n\u003c/QuestionBlock\u003e\n\n\u003cQuestionBlock type=\"reading-content\"\u003e\n\u003cQuestion level={1}\u003eWhat is the \"scientific\" definition of a commonwealth (c. 17)?\u003c/Question\u003e\n\u003c/QuestionBlock\u003e\n\n\u003cQuestionBlock type=\"reading-content\"\u003e\n\u003cQuestion level={1}\u003eHow does the commonwealth come into existence?\u003c/Question\u003e\n\u003c/QuestionBlock\u003e\n\n\u003cQuestionBlock type=\"reading-content\"\u003e\n\u003cQuestion level={1}\u003eIs the covenant that produces the commonwealth a \"valid covenant\"?\u003c/Question\u003e\n\u003cQuestion level={2}\u003eIf so, why is this covenant valid, while prior to this covenant, \"valid covenants\" seemed impossible? In other words, what is unique about this covenant (c. 17)?\u003c/Question\u003e\n\u003c/QuestionBlock\u003e\n\n\u003cQuestionBlock type=\"reading-content\"\u003e\n\u003cQuestion level={1}\u003eWhat is distinctive about a commonwealth that comes to be through an act of Instituting (c. 18)?\u003c/Question\u003e\n\u003cQuestion level={2}\u003eHow might this differ from other aggregates of people or factions?\u003c/Question\u003e\n\u003c/QuestionBlock\u003e\n\n\u003cQuestionBlock type=\"reading-content\"\u003e\n\u003cQuestion level={1}\u003eWhat are the consequences of such an Institution (i.e. what rights belong to the Sovereign)?\u003c/Question\u003e\n\u003cQuestion level={2}\u003eConsider one or two of the rights of the Sovereign and why this right necessarily follows from the nature of the Instituted commonwealth (c. 18)?\u003c/Question\u003e\n\u003c/QuestionBlock\u003e\n\n\u003cQuestionBlock type=\"reading-content\"\u003e\n\u003cQuestion level={1}\u003eWhy must the dissenting vote also recognize the elected sovereign (c. 18)?\u003c/Question\u003e\n\u003c/QuestionBlock\u003e\n\n\u003cQuestionBlock type=\"reading-discussion\"\u003e\n\u003cQuestion level={1}\u003eAt the close of chapter 18, Hobbes notes that the reader might complain that life under the Sovereign seems very miserable. First, having read this far in his book, what is your reaction to the society he describes? Is it a society you would want to live in? Why or why not? Second, how does his response to the objection affect your own opinion? Is he right that we complain only because we have on \"multiplying glasses\" rather than \"prospective glasses\"?\u003c/Question\u003e\n\u003c/QuestionBlock\u003e\n\n## Leviathan, c. 26\n\n\u003cQuestionBlock type=\"reading-content\"\u003e\n\u003cQuestion level={1}\u003eWhat are Civil Laws?\u003c/Question\u003e\n\u003c/QuestionBlock\u003e\n\n\u003cQuestionBlock type=\"reading-content\"\u003e\n\u003cQuestion level={1}\u003eHow are they related to Laws of Nature?\u003c/Question\u003e\n\u003c/QuestionBlock\u003e\n\n\u003cQuestionBlock type=\"reading-content\"\u003e\n\u003cQuestion level={1}\u003eHow are Civil and Natural Laws contained within each other and yet still distinct (c. 26, p. 209a, paragraph 8)?\u003c/Question\u003e\n\u003c/QuestionBlock\u003e\n\n\u003cQuestionBlock type=\"reading-content\"\u003e\n\u003cQuestion level={1}\u003eConsider Hobbes' discussion of making and interpreting the Civil Laws (c. 26, pp. 212-213, paragraphs, 20-24).\u003c/Question\u003e\n\u003cQuestion level={2}\u003eWhy must the Sovereign alone perform these functions?\u003c/Question\u003e\n\u003c/QuestionBlock\u003e\n\n\u003cQuestionBlock type=\"reading-content\"\u003e\n\u003cQuestion level={1}\u003eDo Natural Laws need to be written down? Why or why not?\u003c/Question\u003e\n\u003c/QuestionBlock\u003e\n\n\u003cQuestionBlock type=\"reading-content\"\u003e\n\u003cQuestion level={1}\u003eDo Civil Laws need to be written down? Why or why not?\u003c/Question\u003e\n\u003c/QuestionBlock\u003e\n\n\u003cQuestionBlock type=\"reading-content\"\u003e\n\u003cQuestion level={1}\u003eWhat is the difference between Natural and Positive Laws (c. 26, p. 215b paragraph 37)?\u003c/Question\u003e\n\u003c/QuestionBlock\u003e\n\n\u003cQuestionBlock type=\"reading-content\"\u003e\n\u003cQuestion level={1}\u003eWhat does Hobbes have to say about the Divine Law (c. 26, p. 216, paragraph 40)?\u003c/Question\u003e\n\u003cQuestion level={2}\u003eWhat are the possible problems with Divine Law?\u003c/Question\u003e\n\u003cQuestion level={2}\u003eTo what extent are we ever obligated to it?\u003c/Question\u003e\n\u003c/QuestionBlock\u003e\n\n\u003cQuestionBlock type=\"reading-content\"\u003e\n\u003cQuestion level={1}\u003eWhat is the difference between a Fundamental Law and a Non-Fundamental Law (c. 26, p. 217, paragraph 43)?\u003c/Question\u003e\n\u003c/QuestionBlock\u003e\n\n\u003cQuestionBlock type=\"reading-discussion\"\u003e\n\u003cQuestion level={1}\u003eAs this is our last day with Hobbes's own text, consider what questions still linger for you? What still isn't quite clear and why? Are there aspects of Hobbes' system that seem unconvincing to you? Are there aspects of Hobbes' text that seem really insightful to you? Explain why.\u003c/Question\u003e\n\u003c/QuestionBlock\u003e\n","data":{"title":"The Leviathan, cc. 17-19, 26","description":"The Leviathan, cc. 17-19, 26","order":4,"classno":5,"published":true},"filePath":"hobbes-4.mdx"}]},"__N_SSG":true},"page":"/","query":{},"buildId":"qGO0vcN9Xn97bWRQnoXkI","assetPrefix":"/pl210","isFallback":false,"gsp":true,"scriptLoader":[]}</script></body></html>
